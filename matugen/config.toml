[config]
reload_apps = false
reload_apps_list = []
# set_wallpaper = false

[config.reload]
[templates.phoenix]
input_path = "~/.config/matugen/templates/phoenix.json"
output_path = "~/.local/state/ryu/colors.json"

[templates.foot]
input_path  = "~/.config/matugen/templates/foot.ini"
output_path = "~/.local/state/foot/colors.ini"
post_hook   = 'sh ~/.config/matugen/foot-live.sh'

[templates.monkeytype]
input_path  = "~/.config/matugen/templates/monkeytype.json"
output_path = "~/.local/state/ryu/monkeytype.json"

[templates.typeshi]
input_path = "~/.config/matugen/templates/typeshi.ini"
output_path = "~/.config/typeShi/config.ini"

[templates.sway]
input_path  = "~/.config/matugen/templates/sway-theme.conf"
output_path = "~/.config/sway/config.d/colors.conf"
post_hook   = 'sh ~/.config/matugen/sway-live.sh'

