### Autostart
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland
exec $phoenix ~/development/phoenix/
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec swayidle -w \
    timeout 300 '$ryuctl call lock lock' \
    timeout 330 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep '$ryuctl call lock lock'
