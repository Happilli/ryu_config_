exec dbus-update-activation-environment --systemd XDG_SESSION_TYPE=wayland
exec $phoenix ~/development/phoenix/
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec swayidle -w \
    timeout 60 'loginctl lock-session' \
    timeout 80 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    lock '$ryuctl call lock lock' \
    before-sleep 'loginctl lock-session'
