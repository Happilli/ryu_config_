### Core
floating_modifier $mod normal
bindsym $mod+Return exec $term
bindsym $mod+x exec $browser
# bindsym $mod+l exec loginctl lock-session
bindsym $mod+l exec $ryuctl call lock lock
bindsym $mod+q kill
bindsym $mod+v floating toggle
bindsym $mod+f fullscreen
bindsym $mod+j layout toggle split
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exit

### Quickshell
bindsym --locked $mod+Print exec $ryuctl call screenshot region
bindsym --locked Print exec $ryuctl call screenshot full
bindsym --locked $alt+Print exec $ryuctl call screenshot lasso
bindsym --locked $mod+r exec $ryuctl call recorder toggleScreen $AUDIO_MONITOR
bindsym --locked $mod+Shift+r exec $ryuctl call recorder toggleRegion $AUDIO_MONITOR
bindsym $mod+n exec $ryuctl call communication toggle
bindsym $mod+period exec $ryuctl call clipboard toggle
bindsym $alt+w exec $ryuctl call settings toggle

### Apps
bindsym $alt+q exec qtcreator
bindsym --locked $alt+r exec pkill -2 wl-screenrec || wl-screenrec -f ~/Videos/$(date +%Y-%m-%d_%H-%M-%S).mp4 --audio --audio-device 56

### Media / volume / brightness
bindsym --locked XF86AudioRaiseVolume exec $ryuctl call osd volume 1%+
bindsym --locked XF86AudioLowerVolume exec $ryuctl call osd volume 1%-
bindsym --locked XF86AudioMute exec $ryuctl call osd mute
bindsym --locked XF86MonBrightnessUp exec $ryuctl call osd brightness 1%+
bindsym --locked XF86MonBrightnessDown exec $ryuctl call osd brightness 1%-
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous

### Touchpad toggle
bindsym $mod+t input type:touchpad events toggle

### Focus
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

### Scratchpad 
bindsym $mod+s scratchpad show, resize set 80 ppt 80 ppt, move position center
bindsym $mod+Shift+s move scratchpad

### Workspaces
bindsym $mod+button5 workspace next
bindsym $mod+button4 workspace prev

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
